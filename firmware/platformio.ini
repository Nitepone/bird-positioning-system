; bps (bird positioning system) microcontroller client.
; Run ./configure.sh first (then ./build.sh): it writes bps.conf, which scripts/bps_config.py turns
; into build defines. BPS_CONF=other.conf selects another device's settings.

[platformio]
default_envs = pico_w

[env]
extra_scripts = pre:scripts/bps_config.py
build_flags = -ffp-contract=off
monitor_speed = 115200

; Raspberry Pi boards: the community platform with Earle Philhower's
; arduino-pico core (the official platform lacks Pico W support).
[rp2]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board_build.core = earlephilhower
build_src_filter = +<*> -<port/esp32.cpp>

[env:pico_w]
extends = rp2
board = rpipicow

[env:pico2_w]
extends = rp2
board = rpipico2w

; ESP32: pioarduino's platform, for Arduino core 3.x on ESP-IDF 5 (the
; official platform is still on 2.x).
[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32dev
build_src_filter = +<*> -<port/rp2.cpp>

; Unit tests of the portable core on this computer: pio test -e native
[env:native]
platform = native
build_flags = -ffp-contract=off -lm -DUNITY_INCLUDE_DOUBLE
test_build_src = no
