; bps (bird positioning system) microcontroller client.
; Run ./configure.sh first (then ./build.sh): it writes bps.conf, which scripts/bps_config.py turns
; into build defines. BPS_CONF=other.conf selects another device's settings.

[platformio]
default_envs = pico_w

[env]
extra_scripts = pre:scripts/bps_config.py
build_flags = -ffp-contract=off
monitor_speed = 115200

; Raspberry Pi boards: the community platform with Earle Philhower's
; arduino-pico core (the official platform lacks Pico W support).
[rp2]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board_build.core = earlephilhower
build_src_filter = +<*> -<port/esp32.cpp> -<port/sockets.c>
; Uncomment (here, or in [esp32]) for upload, round-trip and TCP diagnostics in the log.
; build_flags = ${env.build_flags} -DBPS_NET_DEBUG

[env:pico_w]
extends = rp2
board = rpipicow

[env:pico2_w]
extends = rp2
board = rpipico2w

; ESP32 boards: pioarduino's platform, for Arduino core 3.x on ESP-IDF 5 (the
; official platform is still on 2.x).
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
build_src_filter = +<*> -<port/rp2.cpp>
; Uncomment to log every beacon of this network's access points, for the beacon
; sync experiment (scripts/beacon_jitter.py).
; build_flags = ${env.build_flags} -DBPS_BEACON_LOG

[env:esp32]
extends = esp32
board = esp32dev

; Seeed XIAO ESP32S3 (and the Plus, with more pins and flash): 8 MB of PSRAM,
; which holds the ring buffer.
[env:xiao_esp32s3]
extends = esp32
board = seeed_xiao_esp32s3

[env:xiao_esp32s3_plus]
extends = esp32
board = seeed_xiao_esp32_s3_plus

; The bps XIAO board: a XIAO ESP32S3 in its socket, with a PDM microphone
; (IM73D122) on D2/D3 and a battery.
[env:bps_xiao]
extends = esp32
board = seeed_xiao_esp32s3

; Unit tests of the portable core on this computer: pio test -e native
[env:native]
platform = native
build_flags = -ffp-contract=off -lm -DUNITY_INCLUDE_DOUBLE
test_build_src = no
